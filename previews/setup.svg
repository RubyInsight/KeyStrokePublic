<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Keystroke import and setup screen</title>
  <desc id="desc">A dark minimalist study interface with Anki deck import, practice direction choices, and a start button.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .tiny{font-size:13px;letter-spacing:2px;text-transform:uppercase}.small{font-size:15px}.body{font-size:18px}.muted{fill:#777971}.faint{fill:#50524e}.main{fill:#d8d6cf}.accent{fill:#e2b714}
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#111214"/>
  <circle cx="52" cy="44" r="7" fill="#e2b714"/>
  <path d="M42 52c10-19 24-19 34 0" fill="none" stroke="#e2b714" stroke-width="5" stroke-linecap="round"/>
  <text x="88" y="52" class="main" font-size="22" font-weight="650">keystroke</text>
  <text x="1055" y="50" class="muted" font-size="19">▦</text>
  <text x="1092" y="50" class="muted" font-size="19">◈</text>
  <text x="1132" y="50" class="muted" font-size="19">?</text>

  <g transform="translate(105 104)">
    <text x="0" y="0" class="tiny accent">YOUR CARDS, YOUR PACE</text>
    <text x="0" y="62" class="main" font-size="48" font-weight="720">Build recall.</text>
    <text x="0" y="112" class="accent" font-size="48" font-weight="720">One keystroke at a time.</text>
    <text x="0" y="154" class="body muted">Import your cards, keep every deck separate, and study without distractions.</text>

    <g transform="translate(0 192)" filter="url(#shadow)">
      <rect width="990" height="238" rx="14" fill="#191a1c" stroke="#2b2d2b"/>
      <text x="28" y="35" class="main" font-size="17" font-weight="650">Import cards</text>
      <text x="28" y="59" class="small muted">Anki .apkg, text, tab, comma, or semicolon separated</text>
      <text x="897" y="37" class="small accent">try sample</text>
      <rect x="24" y="78" width="942" height="102" rx="9" fill="#141517" stroke="#292b29"/>
      <text x="45" y="112" class="small muted">mitosis</text>
      <text x="205" y="112" class="small main">Cell division producing two identical cells</text>
      <text x="45" y="145" class="small muted">osmosis</text>
      <text x="205" y="145" class="small main">Movement of water across a membrane</text>
      <text x="28" y="213" class="small muted"><tspan fill="#d8d6cf" font-weight="700">2</tspan> cards detected</text>
      <text x="725" y="213" class="small faint">drop a file here</text>
      <rect x="848" y="192" width="118" height="32" rx="7" fill="#242625"/>
      <text x="867" y="213" class="small main">↑ choose file</text>
    </g>

    <text x="0" y="468" class="tiny muted">PRACTICE DIRECTION</text>
    <g transform="translate(0 488)">
      <rect width="276" height="48" rx="9" fill="#282a28" stroke="#e2b714"/>
      <text x="24" y="30" class="small main">term  →  definition</text>
      <rect x="288" width="276" height="48" rx="9" fill="#191a1c" stroke="#2b2d2b"/>
      <text x="312" y="30" class="small muted">definition  →  term</text>
      <rect x="576" width="142" height="48" rx="9" fill="#191a1c" stroke="#2b2d2b"/>
      <text x="618" y="30" class="small muted">mixed</text>
      <rect x="730" width="160" height="48" rx="9" fill="#191a1c" stroke="#2b2d2b"/>
      <text x="767" y="30" class="small muted">anki learn</text>
    </g>
    <rect x="0" y="558" width="208" height="50" rx="9" fill="#e2b714"/>
    <text x="28" y="590" fill="#111214" font-size="16" font-weight="750">START SESSION  ↵</text>
    <text x="228" y="589" class="small faint">stored only on this device</text>
  </g>
  <text x="105" y="675" class="small faint">keystroke · v1.3.0 · created by gemz</text>
  <text x="930" y="675" class="small faint">your data never leaves your device</text>
</svg>
