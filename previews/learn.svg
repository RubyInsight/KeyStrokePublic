<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Keystroke learn mode in the Cyberspace theme</title>
  <desc id="desc">A bright teal learning screen with progress, study statistics, a recall prompt, typed answer, and Anki-style rating buttons.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#005d57" flood-opacity="0.24"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.tiny{font-size:13px;letter-spacing:2px}.small{font-size:15px}.main{fill:#f8f3e3}.muted{fill:#006f68}.panel{fill:#009c91}.line{stroke:#008d83}.cream{fill:#f8f3e3}
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#00b8a9"/>
  <circle cx="52" cy="44" r="7" fill="#f8f3e3"/>
  <path d="M42 52c10-19 24-19 34 0" fill="none" stroke="#f8f3e3" stroke-width="5" stroke-linecap="round"/>
  <text x="88" y="52" class="main" font-size="22" font-weight="650">keystroke</text>
  <text x="1055" y="50" class="muted" font-size="19">▦</text>
  <text x="1092" y="50" class="muted" font-size="19">◈</text>
  <text x="1132" y="50" class="muted" font-size="19">?</text>

  <g transform="translate(96 91)">
    <g>
      <text x="0" y="20" class="muted small">term → definition</text>
      <text x="178" y="20" class="muted small">definition → term</text>
      <text x="366" y="20" class="muted small">mixed</text>
      <rect x="430" y="-8" width="112" height="38" rx="8" fill="#f8f3e3"/>
      <text x="452" y="17" fill="#00756d" font-size="15" font-weight="700">anki learn</text>
      <text x="865" y="20" class="muted small">Biology · missed only</text>
    </g>
    <rect x="0" y="54" width="1008" height="5" rx="3" fill="#008d83"/>
    <rect x="0" y="54" width="655" height="5" rx="3" class="cream"/>

    <g transform="translate(0 85)">
      <text x="0" y="0" class="main" font-size="24" font-weight="720">18 / 30</text>
      <text x="0" y="22" class="tiny muted">PROGRESS</text>
      <text x="248" y="0" class="main" font-size="24" font-weight="720">94%</text>
      <text x="248" y="22" class="tiny muted">ACCURACY</text>
      <text x="492" y="0" class="main" font-size="24" font-weight="720">47</text>
      <text x="492" y="22" class="tiny muted">WPM</text>
      <text x="736" y="0" class="main" font-size="24" font-weight="720">9</text>
      <text x="736" y="22" class="tiny muted">STREAK</text>
    </g>

    <g transform="translate(0 143)" filter="url(#shadow)">
      <rect width="1008" height="390" rx="16" class="panel" stroke="#008d83"/>
      <text x="504" y="55" text-anchor="middle" class="tiny muted">TYPE EVERYTHING YOU REMEMBER</text>
      <text x="504" y="112" text-anchor="middle" class="main" font-size="38" font-weight="720">What is mitosis?</text>
      <rect x="126" y="146" width="756" height="78" rx="10" fill="#00aa9d" stroke="#f8f3e3"/>
      <text x="151" y="191" class="main" font-size="18">Cell division that creates two genetically identical cells</text>
      <rect x="838" y="159" width="30" height="51" rx="7" fill="#f8f3e3"/>
      <text x="847" y="191" fill="#00756d" font-size="19" font-weight="700">↵</text>

      <g transform="translate(126 248)">
        <rect width="177" height="68" rx="9" fill="#009187" stroke="#da3333"/>
        <text x="18" y="28" fill="#da3333" font-size="15" font-weight="700">1  AGAIN</text>
        <text x="18" y="50" class="muted small">1m</text>
        <rect x="193" width="177" height="68" rx="9" fill="#009187" stroke="#e7a95c"/>
        <text x="211" y="28" fill="#e7a95c" font-size="15" font-weight="700">2  HARD</text>
        <text x="211" y="50" class="muted small">6m</text>
        <rect x="386" width="177" height="68" rx="9" fill="#009187" stroke="#f8f3e3"/>
        <text x="404" y="28" class="main" font-size="15" font-weight="700">3  GOOD</text>
        <text x="404" y="50" class="muted small">1d</text>
        <rect x="579" width="177" height="68" rx="9" fill="#009187" stroke="#f8f3e3"/>
        <text x="597" y="28" class="main" font-size="15" font-weight="700">4  EASY</text>
        <text x="597" y="50" class="muted small">7d</text>
      </g>
      <text x="504" y="353" text-anchor="middle" class="muted small">enter submit / next   ·   tab skip   ·   esc pause</text>
    </g>
  </g>
  <text x="96" y="675" class="muted small">keystroke · v1.3.0 · created by gemz</text>
  <text x="930" y="675" class="muted small">Cyberspace theme</text>
</svg>
